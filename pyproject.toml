[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-session-gates"
version = "0.1.0"
description = "Deterministic pre-flight gates for agent and automation workflows: grounding, dispatch-lock, and a composable gate runner."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "agent-session-gates contributors" }]
keywords = ["agents", "guardrails", "determinism", "workflow", "gates", "ci", "preflight"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jarrod-wright/agent-session-gates"
Repository = "https://github.com/jarrod-wright/agent-session-gates"

[project.scripts]
agent-session-gates = "agent_session_gates.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_session_gates = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["agent_session_gates"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
